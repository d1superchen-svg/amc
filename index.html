<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMC 电影规划器</title>
<style>
:root{
  --bg:#f6f6f3; --card:#ffffff; --text:#1b1b1d; --muted:#6c6c72; --faint:#9a9aa1;
  --border:#e6e6e2; --border2:#d6d6d1; --accent:#d4302f; --accent-bg:#fbeaea;
  --hi:#1a8a55; --hi-bg:#e7f4ec; --mid:#b07d12; --mid-bg:#fbf2dd; --lo:#7a7a80; --lo-bg:#efefec;
  --chip:#f3f3ef; --plan:#0d5fb0; --plan-bg:#e7f0fb;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141417; --card:#1e1e23; --text:#ededef; --muted:#a0a0a8; --faint:#74747c;
    --border:#2b2b32; --border2:#3a3a42; --accent:#ff6b6a; --accent-bg:#3a1f1f;
    --hi:#5fd39a; --hi-bg:#15301f; --mid:#e0b65a; --mid-bg:#332915; --lo:#9a9aa2; --lo-bg:#26262c;
    --chip:#26262c; --plan:#6db1f2; --plan-bg:#16273a;
  }
}
*{box-sizing:border-box}
body{margin:0;font-size:17px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 80px}
header.top{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:2px}
h1{font-size:37.4px;font-weight:650;margin:0;letter-spacing:-.01em}
.accent{color:var(--accent)}
.sub{color:var(--muted);font-size:22.1px}
.dates{display:flex;gap:8px;overflow-x:auto;padding:6px 0 10px;margin:14px 0 2px;scrollbar-width:thin}
.datechip{flex:0 0 auto;min-width:60px;text-align:center;padding:7px 11px;border-radius:11px;border:1px solid var(--border2);background:var(--card);cursor:pointer;font-family:inherit;position:relative}
.datechip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.datechip.fri{border-color:var(--hi)}
.datechip.on.fri{background:var(--accent);border-color:var(--accent)}
.datechip .wd{font-size:18.7px;color:var(--muted);display:block;line-height:1.2}
.datechip.on .wd{color:#fff;opacity:.9}
.datechip .md{font-size:25.5px;font-weight:650;line-height:1.25}
.datechip .pd{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--plan)}
.datechip.on .pd{background:#fff}
.datechip.unsched{opacity:.5}
.datechip.unsched.on{opacity:1}
.usdot{display:block;font-size:10px;line-height:1.25;color:#b07d12;font-weight:600;margin-top:1px;white-space:nowrap}
.datechip.on .usdot{color:#fff}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0}
.seg{display:inline-flex;border:1px solid var(--border2);border-radius:99px;overflow:hidden}
.seg button{border:none;background:var(--card);color:var(--muted);font-size:21.2px;padding:6px 13px;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--accent);color:#fff}
.toggle{font-size:21.2px;padding:6px 13px;border:1px solid var(--border2);border-radius:99px;background:var(--card);color:var(--muted);cursor:pointer;font-family:inherit}
.toggle.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.alist{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-size:21.2px;background:var(--hi-bg);color:var(--hi);padding:5px 12px;border-radius:99px}
.alist b{font-weight:650}
.alist button{border:none;background:transparent;color:inherit;cursor:pointer;font-size:25.5px;line-height:1;width:18px;height:18px;border-radius:50%;font-family:inherit}
.alist button:hover{background:rgba(0,0,0,.08)}
.newstrip{margin:14px 0 4px;display:flex;flex-direction:column;gap:8px}
.nsrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:9px 12px}
.nslabel{font-size:19.6px;font-weight:700;color:var(--hi);margin-right:4px;white-space:nowrap}
.nsrow:nth-child(2) .nslabel{color:var(--mid)}
.nsnone{font-size:18.7px;color:var(--faint)}
.nchip{font-family:inherit;font-size:18.7px;line-height:1.3;padding:5px 12px;border-radius:99px;border:1px solid var(--border2);background:var(--bg);color:var(--text);cursor:pointer;text-align:left}
.nchip b{font-weight:700;margin-right:3px;color:var(--muted)}
.nchip.b-hi{border-color:var(--hi);background:var(--hi-bg)} .nchip.b-hi b{color:var(--hi)}
.nchip.b-mid{border-color:var(--mid);background:var(--mid-bg)} .nchip.b-mid b{color:var(--mid)}
.nchip:hover{filter:brightness(.96)}
.synchip{font-family:inherit;font-size:19.6px;padding:5px 12px;border-radius:99px;border:1px solid var(--border2);background:var(--card);color:var(--muted);cursor:pointer;white-space:nowrap}
.synchip.on{color:var(--hi);border-color:var(--hi);background:var(--hi-bg)}
.synchip.busy{color:var(--mid);border-color:var(--mid);background:var(--mid-bg)}
.synchip.err{color:#c0392b;border-color:#c0392b;background:#fdecea}
@media(prefers-color-scheme:dark){.synchip.err{background:#3a1b18;color:#ff8f80;border-color:#ff8f80}}
.syncbox{display:flex;flex-direction:column;gap:12px;font-size:19.6px;line-height:1.55}
.syncbox h3{margin:0;font-size:24px}
.syncbox ol{margin:0;padding-left:1.3em} .syncbox li{margin:4px 0}
.syncbox input{font-family:inherit;font-size:18px;padding:9px 12px;border-radius:10px;border:1px solid var(--border2);background:var(--bg);color:var(--text);width:100%}
.syncbox .row{display:flex;gap:8px;flex-wrap:wrap}
.syncbox .note{font-size:17px;color:var(--muted)}
.syncbox .stat{font-weight:600}
.dayhead{font-size:25.5px;font-weight:600;margin:16px 0 2px}
.dayhead .fritag{font-size:19.6px;color:var(--hi);background:var(--hi-bg);padding:2px 9px;border-radius:99px;margin-left:8px;font-weight:600}
h2.sec{font-size:22.1px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);margin:30px 0 12px;display:flex;align-items:center;gap:8px}
h2.sec .ln{flex:1;height:1px;background:var(--border)}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;gap:14px;margin-bottom:12px}
.poster{flex:0 0 156px;width:156px;height:234px;border-radius:9px;overflow:hidden;position:relative;background:var(--chip);border:1px solid var(--border)}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.poster .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:8px;color:var(--faint)}
.poster .ph svg{width:28px;height:28px;opacity:.6}
.poster .ph span{font-size:18.7px;line-height:1.3;color:var(--muted)}
.poster .newrib{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(90deg,#0a9a4a,#12b45c);color:#fff;font-size:17px;font-weight:700;text-align:center;padding:5px 6px;letter-spacing:.3px;box-shadow:0 -2px 8px rgba(0,0,0,.25)}
.card.newcard{border-color:#2fb56d;box-shadow:0 0 0 2px rgba(47,181,109,.25)}
.body{flex:1;min-width:0}
.titlerow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.title{font-size:28.9px;font-weight:600;letter-spacing:-.01em}
.badge{font-size:19.6px;padding:2px 9px;border-radius:99px;font-weight:600;white-space:nowrap}
.b-hi{background:var(--hi-bg);color:var(--hi)} .b-mid{background:var(--mid-bg);color:var(--mid)} .b-lo{background:var(--lo-bg);color:var(--lo)}
.taste{font-size:20.4px;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.g{font-size:18.7px;padding:2px 8px;border-radius:99px;border:1px solid var(--border2);color:var(--muted)}
.rt{font-size:19.6px;color:var(--faint)}
.syn{font-size:22.1px;color:var(--muted);margin:0 0 10px}
.reason{font-size:20.4px;color:var(--text);background:var(--chip);border-radius:7px;padding:5px 9px;margin:0 0 11px;display:inline-block}
.acts{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:5px;font-size:21.2px;padding:6px 12px;border-radius:8px;border:1px solid var(--border2);background:var(--card);color:var(--text);cursor:pointer;text-decoration:none;font-family:inherit}
.btn:hover{border-color:var(--text)}
.btn svg{width:14px;height:14px}
.btn.want.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.shows{border-top:1px solid var(--border);padding-top:10px;display:flex;flex-direction:column;gap:9px}
.threw{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.thname{font-size:20.4px;color:var(--faint);width:96px;flex:0 0 auto;display:flex;align-items:center;gap:4px;padding-top:3px}
.thname svg{width:12px;height:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.chip{font-size:20.4px;padding:5px 10px;border-radius:8px;border:1px solid var(--border2);background:var(--card);cursor:pointer;color:var(--text);white-space:nowrap;font-family:inherit}
.chip:hover{border-color:var(--plan);color:var(--plan)}
.chip.picked{background:var(--plan-bg);color:var(--plan);border-color:var(--plan)}
.chip .fmt{color:var(--faint);font-size:17.8px;margin-left:4px}
.chip.picked .fmt{color:var(--plan)}
.none{font-size:20.4px;color:var(--faint);padding-top:3px}
.fmts{flex:1;display:flex;flex-direction:column;gap:9px;min-width:0}
.fmtg{display:flex;flex-direction:column;gap:5px}
.fmtlabel{font-size:17.8px;font-weight:600;color:var(--accent);letter-spacing:.03em;text-transform:uppercase}
.credits{font-size:20.4px;color:var(--muted);margin:0 0 8px;line-height:1.5}
.credits b{font-weight:600;color:var(--text)}
.hl{font-size:21.2px;color:var(--text);margin:0 0 7px;line-height:1.55}
.hl b,.recep b{display:inline-block;font-size:17.8px;font-weight:600;color:var(--accent);background:var(--accent-bg);border-radius:4px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.recep{font-size:20.4px;color:var(--muted);margin:0 0 10px;line-height:1.5}
.recep b{color:var(--hi);background:var(--hi-bg)}
.lang{font-size:18.7px;color:var(--mid);background:var(--mid-bg);padding:2px 8px;border-radius:99px}
.f-imax{--fc:#1f6feb}.f-dolby{--fc:#7c3aed}.f-3d{--fc:#0d9488}.f-prime{--fc:#c2740a}.f-laser{--fc:#6b7280}.f-oc{--fc:#1f9d55}.f-lang{--fc:#db2777}
@media(prefers-color-scheme:dark){.f-imax{--fc:#5b9bf6}.f-dolby{--fc:#a78bfa}.f-3d{--fc:#2dd4bf}.f-prime{--fc:#e0a23a}.f-laser{--fc:#9aa0aa}.f-oc{--fc:#4ade80}.f-lang{--fc:#f472b6}}
.fmtg .fmtlabel{color:var(--fc)}
.fmtg .chip{border-color:var(--fc)}
.fmtg .chip:hover{border-color:var(--plan);color:var(--plan)}
.fmtg .chip.picked{background:var(--plan-bg);color:var(--plan);border-color:var(--plan)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:9px 0 2px;font-size:18.7px}
.lg{display:inline-flex;align-items:center;gap:5px;color:var(--fc)}
.lg::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--fc);flex:0 0 auto}
.heat{font-size:18.7px;color:#d9632e;margin-left:2px}
.country{font-size:17px;color:var(--muted);border:1px solid var(--border2);border-radius:99px;padding:1px 9px}
.ending{font-size:17px;color:var(--accent);background:var(--accent-bg);border-radius:99px;padding:1px 9px;font-weight:600}
.lasting{font-size:16px;color:var(--faint)}
.sparsehint{grid-column:1/-1;font-size:16px;color:var(--mid);background:var(--mid-bg);border-radius:10px;padding:10px 14px;margin-bottom:4px;line-height:1.5}
.special{font-size:16px;color:#9a6a12;background:#fbe9c6;border-radius:99px;padding:1px 11px;font-weight:600}
.newbadge{font-size:16px;color:#0a7d3c;background:#d8f3e3;border-radius:99px;padding:1px 10px;font-weight:600}
@media(prefers-color-scheme:dark){.newbadge{color:#5fe0a0;background:#123726}}
.specialcard{border-color:#e0a23a;box-shadow:0 0 0 2px #e0a23a inset}
.paidtag{position:absolute;top:6px;left:6px;z-index:2;font-size:13px;background:#d9a23a;color:#fff;border-radius:6px;padding:1px 8px;font-weight:600}
.slot.empty.paid{border-color:#d9a23a;color:#b07d12}
.slot.full.paid{border-color:#d9a23a}
@media(prefers-color-scheme:dark){.special{color:#f0c36a;background:#3a2c12}.slot.empty.paid{color:#e0b65a}}
.clk{cursor:pointer}
.poster.clk:hover{opacity:.9}
.title.clk:hover{color:var(--accent)}
.cardreason{font-size:21.2px;color:var(--text);background:var(--chip);border-radius:7px;padding:6px 10px;margin:0 0 10px}
.soonc{cursor:pointer;color:inherit}
.soonc .st:hover{color:var(--accent)}
.sp .pph2{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--faint)}
.sp .pph2 svg{width:26px;height:26px}
.mbk{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto}
.modal{position:relative;background:var(--card);border:1px solid var(--border);border-radius:16px;max-width:780px;width:100%;padding:18px;margin-bottom:5vh}
.mclose{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;border:1px solid var(--border2);background:var(--card);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}
.mclose svg{width:15px;height:15px}
.mclose:hover{background:var(--chip)}
.mhead{display:flex;gap:16px;margin-bottom:14px}
.mposter{flex:0 0 162px;width:162px;height:243px;border-radius:10px;overflow:hidden;background:var(--chip);border:1px solid var(--border);position:relative}
.mposter img{width:100%;height:100%;object-fit:cover}
.mhi{flex:1;min-width:0;padding-right:26px}
.mtitle{font-size:32.3px;font-weight:650;line-height:1.25;margin-bottom:8px}
.mhi .meta{margin-bottom:10px}
.mbody .msyn{font-size:22.9px;color:var(--text);line-height:1.75;margin:0 0 12px}
.mbody .hl,.mbody .recep{font-size:22.1px}
@media(max-width:520px){.mhead{flex-direction:column}.mposter{width:134px;height:201px}}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:4px}
@media(max-width:560px){.board{grid-template-columns:repeat(2,1fr)}}
.slot{border-radius:12px;min-height:208px;display:flex;flex-direction:column}
.slot.empty{border:1.5px dashed var(--border2);align-items:center;justify-content:center;color:var(--faint);font-size:21.2px;min-height:208px}
.slot.full{position:relative;background:var(--card);border:1px solid var(--border);overflow:hidden}
.slot .srm{position:absolute;top:6px;right:6px;z-index:2;width:23px;height:23px;border-radius:50%;border:none;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.slot .srm svg{width:13px;height:13px}
.slot .srm:hover{background:var(--accent)}
.sposter{height:160px;background:var(--chip);overflow:hidden}
.sposter img{width:100%;height:100%;object-fit:cover;display:block}
.sposter .pph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--faint)}
.sposter .pph svg{width:24px;height:24px}
.sinfo{padding:8px 9px}
.stitle{font-size:21.2px;font-weight:600;line-height:1.25;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.smeta{font-size:20.4px;font-weight:600;color:var(--plan)}
.ssub{font-size:18.7px;color:var(--muted);margin-top:1px;line-height:1.3}
.overwarn{font-size:20.4px;color:var(--accent);margin:-2px 0 10px}
.empty{font-size:22.1px;color:var(--faint);padding:14px 2px}
.plan-day{font-size:21.2px;font-weight:600;color:var(--plan);margin:14px 0 8px}
.plan-item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 12px;margin-bottom:8px}
.plan-item .pt{font-size:23.8px;font-weight:600;color:var(--plan);width:60px;flex:0 0 auto}
.plan-item .pmid{flex:1;min-width:0}
.plan-item .ptitle{font-size:23.8px;font-weight:500}
.plan-item .psub{font-size:19.6px;color:var(--muted)}
.plan-item .rm{border:none;background:transparent;color:var(--faint);cursor:pointer;font-size:28.9px;line-height:1;font-family:inherit}
.plan-item .rm:hover{color:var(--accent)}
.soon{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:12px}
.soon a{text-decoration:none;color:inherit}
.soon .sp{height:232px;border-radius:9px;background:var(--chip);border:1px solid var(--border);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.soon .sp img{width:100%;height:100%;object-fit:cover}
.soon .sp svg{width:26px;height:26px;color:var(--faint);opacity:.6}
.soon .st{font-size:21.2px;font-weight:500;margin-top:6px;line-height:1.3}
.soon .sd{font-size:18.7px;color:var(--muted)}
.soon .sd .dot{color:var(--hi)}
.foot{margin-top:34px;padding-top:14px;border-top:1px solid var(--border);font-size:19.6px;color:var(--faint);line-height:1.7}
@media(max-width:520px){ .poster{flex-basis:128px;width:128px;height:192px} .thname{width:100%} }

#movies{display:grid;grid-template-columns:repeat(auto-fill,minmax(540px,1fr));gap:14px}
@media(max-width:1100px){#movies{grid-template-columns:1fr}}
@media(max-width:560px){
  .wrap{padding:14px 12px 60px}
  h1{font-size:24px} .sub{font-size:14px}
  .dates{gap:6px} .datechip{min-width:52px;padding:6px 9px}
  .datechip .wd{font-size:12px} .datechip .md{font-size:18px} .usdot{font-size:10px}
  .seg button,.toggle,.alist{font-size:13px;padding:5px 11px}
  .legend{font-size:12px;gap:9px} .lg{gap:4px}
  .dayhead{font-size:16px} .dayhead .fritag{font-size:12px} h2.sec{font-size:13px}
  .synchip{font-size:12px;padding:4px 9px} .syncbox{font-size:13px} .syncbox h3{font-size:16px} .syncbox input{font-size:16px} .syncbox .note{font-size:12px}
  .newstrip{gap:6px} .nsrow{padding:7px 9px;gap:6px;border-radius:11px} .nslabel{font-size:13px} .nsnone{font-size:12px} .nchip{font-size:12px;padding:4px 9px}
  .card{padding:11px;gap:11px;border-radius:12px}
  .poster{flex:0 0 104px;width:104px;height:156px}
  .title{font-size:18px} .badge{font-size:13px;padding:2px 8px} .taste{font-size:12px}
  .g,.rt,.country,.lang,.heat,.ending,.lasting,.special,.newbadge{font-size:12px}
  .poster .newrib{font-size:11px;padding:3px 4px}
  .cardreason{font-size:13px;padding:5px 9px}
  .btn{font-size:13px;padding:5px 10px} .btn svg{width:13px;height:13px}
  .fmtlabel{font-size:11px} .chip{font-size:13px;padding:4px 9px}
  .thname{font-size:12px;width:100%} .none{font-size:12px} .fmts{gap:8px}
  .stitle{font-size:13px} .smeta{font-size:12px} .ssub{font-size:11px} .paidtag{font-size:12px}
  .sparsehint{font-size:13px;padding:9px 11px}
  .soon .st{font-size:13px} .soon .sd{font-size:11px}
  .board{grid-template-columns:repeat(2,1fr);gap:9px}
  .mtitle{font-size:20px} .mbody .msyn{font-size:14px} .credits{font-size:13px}
  .mhi{padding-right:20px} .mposter{flex:0 0 104px;width:104px;height:156px} .modal{padding:14px}
}
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <h1><span class="accent">AMC</span> 电影规划器</h1>
  <div class="sub">未来 2 周 · 三家影院合并</div>

<script>
const DATA = JSON.parse(document.getElementById('movie-data').textContent);
const RECORD={hi:'b-hi',mid:'b-mid',lo:'b-lo',unknown:'b-lo'};
const RECLABEL={hi:'🟢 强烈推荐',mid:'🟡 可看',lo:'⚪ 一般',unknown:'🔎 待核'};
const RECRANK={hi:0,mid:1,unknown:2,lo:3};
const THEATERS=['Mercado 20','Eastridge 15','Sunnyvale 12'];
const ICON={
  film:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 8h4M3 16h4M17 8h4M17 16h4"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7-4.6-9.3-8.5C1 9.5 2.5 6 6 6c2 0 3.2 1.2 4 2.3C10.8 7.2 12 6 14 6c3.5 0 5 3.5 3.3 6.5C19 16.4 12 21 12 21z"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 21s-6-5.3-6-10a6 6 0 1112 0c0 4.7-6 10-6 10z"/><circle cx="12" cy="11" r="2"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>'
};
const CAT=t=>DATA.catalog[t]||{genres:["待核"],rating:"",runtime:"",rec:"unknown",stars:null,taste:"🔎 待核",reason:"",syn:"介绍研究中…",director:"",cast:[],highlights:"",reception:"",language:"",country:"",isNew:false,poster:null,trailer:"https://www.youtube.com/results?search_query="+encodeURIComponent(t+" 2026 trailer")};

const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){localStorage.setItem(k,JSON.stringify(v))}};
let want=new Set(LS.get('amc_want',[]));
let plan=LS.get('amc_plan2',[]);  // [{title,theater,t,f,date}]
const saveWant=()=>{LS.set('amc_want',[...want]);SYNC.mark();};
const savePlan=()=>{LS.set('amc_plan2',plan);SYNC.mark();};

function curWeek(){const t=new Date();const back=(t.getDay()-5+7)%7;const s=new Date(t);s.setDate(t.getDate()-back);s.setHours(0,0,0,0);const e=new Date(s);e.setDate(s.getDate()+6);e.setHours(23,59,59,999);return[s,e];}
function inCurWeek(ds){const[s,e]=curWeek();const d=new Date(ds+'T12:00:00');return d>=s&&d<=e;}
function weekIndexOf(ds){const s=curWeek()[0];const d=new Date(ds+'T12:00:00');return Math.floor((d-s)/(7*86400000));}
function weekLabel(i){const s=new Date(curWeek()[0]);s.setDate(s.getDate()+7*i);const e=new Date(s);e.setDate(s.getDate()+6);const f=x=>`${x.getMonth()+1}/${x.getDate()}`;return `${f(s)}–${f(e)}`;}
function renderAList(){const used=plan.filter(p=>inCurWeek(p.date)).length;const left=Math.max(0,4-used);const paid=Math.max(0,used-4);document.getElementById('alist').innerHTML=`<span>A-List 本周 <b>${left}/4</b> 免费${paid?` · +${paid} 付费`:''}</span>`;}

let selDate=DATA.days[0].date, theater='all', recOnly=false;

function planCountFor(date){return plan.filter(p=>p.date===date).length;}
function renderDates(){
  document.getElementById('dates').innerHTML=DATA.days.map(d=>{
    const has=planCountFor(d.date)>0?'<span class="pd"></span>':'';
    const uns=d.date>HORIZON;
    return `<div class="datechip${d.date===selDate?' on':''}${d.fri?' fri':''}${uns?' unsched':''}" onclick="pickDate('${d.date}')" ${uns?'title="AMC 还没排全这天(临近才放出)"':''}><span class="wd">${d.wd}</span><span class="md">${d.md}</span>${uns?'<span class="usdot">未排全</span>':''}${has}</div>`;
  }).join('');
}
function pickDate(dt){selDate=dt;renderDates();renderMovies();}

function dayTitles(date){
  const st=DATA.showtimes[date]||{};
  const ths=theater==='all'?THEATERS:[theater];
  const set=new Set();
  ths.forEach(th=>Object.keys(st[th]||{}).forEach(t=>{ if((st[th][t]||[]).length) set.add(t); }));
  return [...set];
}
function heat(title,date){const st=DATA.showtimes[date]||{};const ths=theater==='all'?THEATERS:[theater];let n=0;ths.forEach(th=>{n+=((st[th]||{})[title]||[]).length;});return n;}
function lastShowDate(title){let last=null;for(const d of DATA.days){const st=DATA.showtimes[d.date]||{};let has=false;for(const th of THEATERS){if(((st[th]||{})[title]||[]).length){has=true;break;}}if(has)last=d.date;}return last;}
function dayFilmCount(date){const st=DATA.showtimes[date]||{};const s=new Set();THEATERS.forEach(th=>{for(const t in (st[th]||{}))if(st[th][t].length)s.add(t);});return s.size;}
function completeHorizon(){let mx=0;DATA.days.forEach(d=>{const c=dayFilmCount(d.date);if(c>mx)mx=c;});let h=DATA.days[0].date;DATA.days.forEach(d=>{if(dayFilmCount(d.date)>=mx*0.55)h=d.date;});return h;}
const HORIZON=completeHorizon();
function numDates(title){let n=0;for(const d of DATA.days){const st=DATA.showtimes[d.date]||{};for(const th of THEATERS){if(((st[th]||{})[title]||[]).length){n++;break;}}}return n;}
const PLAYED=new Set(DATA.playedToday||[]);   // 今天完整片单(含早场已过):这些片明天不算「首映」
function firstDate(title){for(const d of DATA.days){const st=DATA.showtimes[d.date]||{};for(const th of THEATERS){if(((st[th]||{})[title]||[]).length)return d.date;}}return null;}
function showtimesHTML(title,date){
  const st=DATA.showtimes[date]||{};
  const ths=theater==='all'?THEATERS:[theater];
  return ths.map(th=>{
    const list=(st[th]||{})[title]||[];
    if(!list.length) return `<div class="threw"><div class="thname">${ICON.pin}${th}</div><div class="fmts"><span class="none">无场次</span></div></div>`;
    const groups=[],idx={};
    list.forEach(s=>{const f=s.f||'标准';if(!(f in idx)){idx[f]=groups.length;groups.push({f,times:[]});}groups[idx[f]].times.push(s);});
    const gh=groups.map(g=>`<div class="fmtg ${fmtClass(g.f)}"><div class="fmtlabel">${g.f}</div><div class="chips">${g.times.map(s=>{
        const pk=plan.some(p=>p.title===title&&p.theater===th&&p.t===s.t&&p.date===date&&(p.f||'')===(s.f||''))?' picked':'';
        return `<button class="chip${pk}" onclick="togglePick('${esc(title)}','${th}','${s.t}','${esc(s.f||'')}','${date}')">${s.t}</button>`;
      }).join('')}</div></div>`).join('');
    return `<div class="threw"><div class="thname">${ICON.pin}${th}</div><div class="fmts">${gh}</div></div>`;
  }).join('');
}
const esc=s=>String(s).replace(/'/g,"\\'");
function fmtClass(f){f=f||'';if(/IMAX/.test(f))return 'f-imax';if(/Dolby/.test(f))return 'f-dolby';if(/3D/.test(f))return 'f-3d';if(/PRIME/.test(f))return 'f-prime';if(/Open Caption|OC/.test(f))return 'f-oc';if(/Laser/.test(f))return 'f-laser';return 'f-lang';}
function fmtDate(ds){if(!ds)return '';if(ds.length<=7)return (+ds.slice(5,7))+'月';const p=ds.split('-');return `${+p[1]}/${+p[2]}`;}
function posterImg(m,title){return m.poster?`<img src="${m.poster}" alt="${title||''}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="ph" style="display:none">${ICON.film}<span>${title||''}</span></div>`:`<div class="ph">${ICON.film}<span>${title||''}</span></div>`;}
function detailData(t){if(DATA.catalog[t])return Object.assign({},DATA.catalog[t],{title:t,kind:'now'});const c=(DATA.comingSoon||[]).find(x=>x.title===t);if(c)return Object.assign({},c,{kind:'soon',syn:c.syn||c.note||''});return null;}
function openDetail(t){
  const m=detailData(t);if(!m)return;
  window.__detailTitle=t;
  const stars=m.stars?` · ⭐ ${m.stars}`:'';
  const genres=(m.genres||[]).map(g=>`<span class="g">${g}</span>`).join('');
  const rt=[m.rating,m.runtime].filter(Boolean).join(' · ');
  const langTag=(m.language&&!/英语|English/.test(m.language))?`<span class="lang">${m.language}</span>`:'';
  const dateLine=m.kind==='soon'?`<span class="rt">上映 ${fmtDate(m.date)}</span>`:'';
  const dir=m.director?`<div class="credits"><b>导演</b> ${m.director}</div>`:'';
  const castA=(m.cast&&m.cast.length)?`<div class="credits"><b>主演</b> ${m.cast.join(' / ')}</div>`:'';
  const trailer=m.trailer||('https://www.youtube.com/results?search_query='+encodeURIComponent(m.title+' trailer'));
  document.getElementById('modal').innerHTML=`<div class="mbk" onclick="if(event.target===this)closeDetail()"><div class="modal"><button class="mclose" onclick="closeDetail()" aria-label="关闭">${ICON.x}</button>
    <div class="mhead"><div class="mposter">${posterImg(m,m.title)}</div><div class="mhi"><div class="mtitle">${m.title}</div>
      <div class="titlerow">${m.rec?`<span class="badge ${RECORD[m.rec]}">${RECLABEL[m.rec]}${stars}</span>`:''}<span class="taste">${m.taste||''}</span></div>
      <div class="meta">${genres}${rt?`<span class="rt">${rt}</span>`:''}${dateLine}${m.country?`<span class="country">${m.country}</span>`:''}${langTag}</div>${dir}${castA}</div></div>
    <div class="mbody">${m.syn?`<p class="msyn">${m.syn}</p>`:''}
      ${m.highlights?`<div class="hl"><b>看点</b>${m.highlights}</div>`:''}
      ${m.reception?`<div class="recep"><b>口碑</b>${m.reception}</div>`:''}
      ${m.reason?`<div class="reason">${m.reason}</div>`:''}
      <div class="acts"><a class="btn" href="${trailer}" target="_blank" rel="noopener">${ICON.play} 预告片</a>${m.kind==='now'?`<button class="btn want${want.has(m.title)?' on':''}" onclick="toggleWant('${esc(m.title)}');openDetail('${esc(m.title)}')">${ICON.heart} ${want.has(m.title)?'已想看':'想看'}</button>`:''}</div>
    </div></div></div>`;
  document.body.style.overflow='hidden';
}
function closeDetail(){document.getElementById('modal').innerHTML='';document.body.style.overflow='';window.__detailTitle=null;}

function cardHTML(title,date){
  const m=CAT(title);
  const stars=m.stars?` · ⭐ ${m.stars}`:'';
  const genres=(m.genres||[]).map(g=>`<span class="g">${g}</span>`).join('');
  const rt=[m.rating,m.runtime].filter(Boolean).join(' · ');
  const langTag=(m.language&&!/英语|English/.test(m.language))?`<span class="lang">${m.language}</span>`:'';
  const hc=heat(title,date);
  const ld=lastShowDate(title), ending=ld&&ld<HORIZON;

/* ---------- 云同步(GitHub Gist · 用户 2026-09-23 选定)----------
   计划/想看原本只存在 localStorage,而 localStorage 按「浏览器 + 来源」隔离:file:// / localhost / github.io
   各存各的,手机和 Mac 更不互通。这里把它同步到**你自己账号下的一个 secret gist**:
   每台设备粘贴一次 GitHub token(只需 gist 权限)→ 之后自动双向同步。
   · token 只写进本机 localStorage(amc_gh_token),绝不进仓库、绝不出现在页面源码里。
   · gist 不写死 id,用 token 现查描述 = SYNC_TAG 且 public===false 的那个(没有就建)。
   · 冲突处理(2026-09-23 多 agent 复核后重写,原版有 7 处会丢数据的缺陷):
       - **写之前必须先读**:本设备没跟远端对过账(seeded=0)之前一律不许 PATCH;
         PATCH 前再 GET 一次,远端比我方基线新 → 先并集再写,绝不拿陈旧文档盲覆盖。
       - 基线时间戳 baseline 放**内存**(不是 localStorage),否则同浏览器两个页签会互相误判为"已最新"。
       - 远端**读不出来**(网络错/JSON 坏/raw 取不到)≠ 远端为空,直接报错停手,不许覆盖。
       - 换令牌 = 重新首连(重走并集);gist 被删(404)自动重新定位;locate 并发去重,避免建出两个 gist。 */
const SYNC_TAG='amc-planner-sync', SYNC_FILE='amc-plan.json';
const escH=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pkey=p=>[p.date,p.theater,p.t,p.f||'',p.title].join('|');
function cleanDoc(o){ // 远端内容当数据看:只收字符串字段、去控制字符、限长限量(输出端另有 escH 转义)
  const str=(v,n)=>typeof v==='string'?v.replace(/[\u0000-\u001f\u007f]/g,'').slice(0,n):'';
  const plan=(Array.isArray(o&&o.plan)?o.plan:[]).slice(0,500)
    .map(p=>({title:str(p&&p.title,200),theater:str(p&&p.theater,60),t:str(p&&p.t,20),f:str(p&&p.f,80),date:str(p&&p.date,10)}))
    .filter(p=>p.title&&/^\d{4}-\d{2}-\d{2}$/.test(p.date));
  const want=(Array.isArray(o&&o.want)?o.want:[]).slice(0,500).map(t=>str(t,200)).filter(Boolean);
  const at=Number(o&&o.updatedAt);
  return {plan,want,updatedAt:Number.isFinite(at)&&at>0?at:0};
}
const unionDoc=(a,b)=>{const m=new Map();[...a.plan,...b.plan].forEach(p=>m.set(pkey(p),p));
  return {plan:[...m.values()],want:[...new Set([...a.want,...b.want])],updatedAt:Date.now()};};
const SYNC={
  tag:'off', note:'', timer:null, pulling:null, locating:null, lastPull:0, dirty:false,
  baseline:LS.get('amc_doc_at',0),      // 内存基线:本页签最后一次"见过的远端状态"时间戳
  get token(){return localStorage.getItem('amc_gh_token')||''},
  set token(v){v?localStorage.setItem('amc_gh_token',v):localStorage.removeItem('amc_gh_token')},
  get gid(){return localStorage.getItem('amc_gist_id')||''},
  set gid(v){v?localStorage.setItem('amc_gist_id',v):localStorage.removeItem('amc_gist_id')},
  get seeded(){return !!LS.get('amc_sync_seeded',0)}, set seeded(v){LS.set('amc_sync_seeded',v?1:0)},
  setAt(v){this.baseline=v;LS.set('amc_doc_at',v);},
  doc(){return {v:1,updatedAt:this.baseline,plan,want:[...want]}},
  show(tag,note){this.tag=tag;this.note=note==null?this.note:note;const b=document.getElementById('syncchip');if(!b)return;
    b.className='synchip'+(tag==='on'?' on':tag==='busy'?' busy':tag==='err'?' err':'');
    b.textContent=tag==='on'?('☁ 已同步'+(note?' '+note:'')):tag==='busy'?'☁ 同步中…':tag==='err'?'☁ 同步出错':'☁ 同步';},
  hhmm(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');},
  async api(path,opts){opts=opts||{};
    let r; try{ r=await fetch('https://api.github.com'+path,Object.assign({},opts,{headers:Object.assign({
      'Accept':'application/vnd.github+json','Authorization':'Bearer '+this.token,'X-GitHub-Api-Version':'2022-11-28'},opts.headers||{})}));
    }catch(e){ const err=new Error('连不上 GitHub(网络?)'); err.status=0; throw err; }
    if(!r.ok){const m=r.status===401?'令牌无效或已过期':r.status===403?'权限不足或被限流(令牌需勾 gist)':r.status===404?'找不到 gist':('HTTP '+r.status);
      const e=new Error(m); e.status=r.status; throw e;}
    return r.status===204?null:r.json();},
  async locate(){   // 并发去重:pull 和 push 同时调也只会有一个在飞,避免建出两个 gist
    if(this.gid) return this.gid;
    if(this.locating) return this.locating;
    this.locating=(async()=>{
      for(let page=1;page<=10;page++){          // 分页翻,gist 多的账号也能找到
        const list=await this.api('/gists?per_page=100&page='+page);
        if(!Array.isArray(list)||!list.length) break;
        const hit=list.find(g=>g&&g.description===SYNC_TAG&&g.public===false);
        if(hit){this.gid=hit.id;return hit.id;}
        if(list.length<100) break;
      }
      const made=await this.api('/gists',{method:'POST',body:JSON.stringify({description:SYNC_TAG,public:false,
        files:{[SYNC_FILE]:{content:JSON.stringify({v:1,updatedAt:Date.now(),plan,want:[...want]})}}})});
      this.gid=made.id; this.seeded=true;      // 新建的 gist 内容就是本机文档,等于已对过账
      return made.id;
    })().finally(()=>{this.locating=null;});
    return this.locating;},
  async read(id){   // 读远端。读不出来就抛,绝不返回"空文档"(否则会被本机整份覆盖)
    const g=await this.api('/gists/'+id);
    const f=g.files&&g.files[SYNC_FILE];
    if(!f) return {plan:[],want:[],updatedAt:0};   // 只有文件确实不存在才算空
    let txt=f.content;
    if(f.truncated&&f.raw_url){ const r=await fetch(f.raw_url); if(!r.ok){const e=new Error('远端文件读取失败');e.status=r.status;throw e;} txt=await r.text(); }
    let o; try{ o=JSON.parse(txt||'{}'); }catch(e){ const err=new Error('远端文件内容损坏,已停手不覆盖'); err.status=-1; throw err; }
    return cleanDoc(o);},
  adopt(d){ plan=d.plan; want=new Set(d.want); LS.set('amc_plan2',plan); LS.set('amc_want',[...want]); this.setAt(d.updatedAt);
    renderMovies();renderDates();renderPlan();renderAList();
    if(window.__detailTitle&&document.getElementById('modal').innerHTML) openDetail(window.__detailTitle);},
  async withGist(fn){  // gist 被删(404)时清掉缓存 id 重新定位一次
    try{ return await fn(await this.locate()); }
    catch(e){ if(e.status===404&&this.gid){ this.gid=''; return await fn(await this.locate()); } throw e; }},
  async pull(force){
    if(!this.token) return;
    if(this.pulling) return this.pulling;                       // 复用在飞的那次,别静默空转
    if(!force&&Date.now()-this.lastPull<15000) return;
    this.lastPull=Date.now(); this.show('busy');
    this.pulling=(async()=>{
      const epoch=this.token;
      try{
        const remote=await this.withGist(id=>this.read(id));
        if(this.token!==epoch) return;                          // 期间断开/换令牌了就别再动本地
        if(!this.seeded){                                        // 本设备首次对账:并集,谁的都不丢
          const merged=unionDoc({plan,want:[...want]},remote);
          this.seeded=true; this.adopt(merged); await this.write(merged);
        } else if(remote.updatedAt>this.baseline){ this.adopt(remote); this.show('on',this.hhmm());
        } else if(this.baseline>remote.updatedAt){ await this.write(this.doc());
        } else this.show('on',this.hhmm());
      }catch(e){ this.show('err',''); this.note=e.message||String(e); }
      finally{ this.pulling=null; }
    })();
    return this.pulling;},
  async write(d){    // 真正落笔:写前再读一次,远端比基线新就先并集,绝不盲覆盖
    await this.withGist(async id=>{
      const remote=await this.read(id);
      let out=d;
      if(remote.updatedAt>this.baseline){ out=unionDoc(d,remote); this.adopt(out); }
      out={v:1,updatedAt:out.updatedAt||Date.now(),plan:out.plan,want:out.want};
      await this.api('/gists/'+id,{method:'PATCH',body:JSON.stringify({files:{[SYNC_FILE]:{content:JSON.stringify(out)}}})});
      this.setAt(out.updatedAt);
    });
    this.dirty=false; this.show('on',this.hhmm());},
  async push(now){
    if(!this.token) return;
    clearTimeout(this.timer); this.timer=null;
    if(!now){ this.dirty=true; this.timer=setTimeout(()=>this.push(true),1200); this.show('busy'); return; }
    if(!this.seeded){                 // 没对过账不许写。先补一次 pull(它内部会并集并落盘)
      if(this.pulling){ this.timer=setTimeout(()=>this.push(true),1200); return; }   // 在飞就稍后重试,别丢改动
      await this.pull(true); if(!this.seeded) return;  // pull 失败 → 保持红字,下次再说
      if(!this.dirty) return;         // pull 的并集已经把这次改动写上去了
    }
    this.show('busy');
    try{ await this.write(this.doc()); }
    catch(e){ this.show('err',''); this.note=e.message||String(e); }},
  mark(){ this.setAt(Date.now()); this.dirty=true; if(this.token)this.push(false); },
  flush(){ if(this.timer){ clearTimeout(this.timer); this.timer=null; this.push(true); } },
  init(){
    if(this._wired) { if(this.token) this.pull(true); else this.show('off'); return; }
    this._wired=true;
    document.addEventListener('visibilitychange',()=>{ if(document.hidden) this.flush(); else this.pull(); });
    window.addEventListener('pagehide',()=>this.flush());
    window.addEventListener('focus',()=>this.pull());
    window.addEventListener('storage',e=>{      // 同浏览器另一个页签改了 → 立刻跟上,别用陈旧文档去覆盖
      if(!e.key||['amc_plan2','amc_want','amc_doc_at'].indexOf(e.key)<0) return;
      plan=LS.get('amc_plan2',[]); want=new Set(LS.get('amc_want',[])); this.baseline=LS.get('amc_doc_at',0);
      renderMovies();renderDates();renderPlan();renderAList();});
    if(!this.token){this.show('off');return;}
    this.show('busy'); this.pull(true);},
};

      <div class="note">你选的场次默认只存在当前浏览器里,所以换设备、或从本地文件换成网址打开,就看不到了。连上之后,计划会存进<b>你自己 GitHub 账号下的一个 secret gist</b>,几台设备自动保持一致。</div>
      <ol>
        <li><a href="https://github.com/settings/tokens/new?scopes=gist&description=AMC%20movie%20planner" target="_blank" rel="noopener">点这里创建令牌</a>(权限只勾 <b>gist</b>)</li>
        <li>复制生成的令牌,粘到下面,点「连接」</li>
        <li>在另一台设备上打开本页,重复一次即可</li>
      </ol>
      <input id="ghtok" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="-webkit-text-security:disc" placeholder="粘贴令牌 ghp_… 或 github_pat_…">
      <div class="row">
        <button class="btn" onclick="connectSync()">连接</button>
        ${on?'<button class="btn" onclick="SYNC.pull(true);closeDetail()">立即拉取</button>':''}
        ${on?'<button class="btn" onclick="disconnectSync()">断开</button>':''}
      </div>
      <div class="note">令牌只写在这台设备的浏览器里,不会进入网站代码或仓库。gist 是 <b>secret</b>:不会出现在你的主页和搜索结果里,但拿到链接的人能看到(里面只有片名和场次)。断开只清本机,云端副本要删的话去 <a href="https://gist.github.com/" target="_blank" rel="noopener">gist.github.com</a>。</div>
    </div></div></div>`;
  document.body.style.overflow='hidden';
}
async function connectSync(){
  const el=document.getElementById('ghtok'); const v=(el&&el.value||'').trim();
  if(!v){alert('请先粘贴令牌');return;}
  if(el)el.value='';
  const old=SYNC.token; SYNC.token=v;
  try{ await SYNC.api('/gists?per_page=1'); }          // 先验令牌,验不过不留痕
  catch(e){ SYNC.token=old; alert('令牌不可用:'+(e.message||e)+'\n没有保存,请重新复制一个(权限勾 gist)'); return; }
  SYNC.gid=''; SYNC.seeded=false;                       // 换令牌 = 重新首连,强制走一次并集
  closeDetail(); SYNC.show('busy'); await SYNC.init();
  if(SYNC.tag==='err') alert('连接失败:'+SYNC.note);
}
function disconnectSync(){
  if(!confirm('断开后这台设备不再同步(云端副本保留,可去 gist.github.com 自行删除)。确定断开?'))return;
  clearTimeout(SYNC.timer); SYNC.timer=null; SYNC.token=''; SYNC.gid=''; SYNC.seeded=false; SYNC.show('off',''); closeDetail();
}

renderAList();renderDates();renderNewStrip();renderMovies();renderPlan();renderSoon();SYNC.init();
</script>
</body>
